<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal de Bord — OMAR Cheptel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600&display=swap');

  :root{
    --navy:#1A5276;
    --navy-d:#134260;
    --band:#EBF5FB;
    --ink:#1c2733;
    --muted:#5a6b7a;
    --line:#d8e2ea;
    --bg:#f4f7f9;
    --white:#fff;
    --green:#1e8449;
    --amber:#b9770e;
    --grey:#7a8a98;
    --red:#922b21;
    --shadow:0 1px 2px rgba(26,82,118,.06),0 8px 24px rgba(26,82,118,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Spline Sans',sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(26,82,118,.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}

  header.top{
    background:linear-gradient(135deg,var(--navy),var(--navy-d));
    color:#fff;border-radius:18px;padding:26px 28px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  header.top::after{
    content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;
    background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);
  }
  header.top h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:30px;letter-spacing:-.5px;
    display:flex;align-items:center;gap:12px;
  }
  header.top p{color:#cfe2ef;margin-top:6px;font-size:14px}
  .stats{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
    border-radius:12px;padding:10px 16px;backdrop-filter:blur(4px)}
  .stat b{font-family:'Fraunces',serif;font-size:22px;display:block;line-height:1}
  .stat span{font-size:11px;color:#cfe2ef;text-transform:uppercase;letter-spacing:.06em}

  .sync{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:12.5px;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
    padding:6px 12px;border-radius:20px;color:#cfe2ef}
  .sync .dot{width:8px;height:8px;border-radius:50%;background:var(--grey)}
  .sync.ok .dot{background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.25)}
  .sync.err .dot{background:#e74c3c}
  .sync.load .dot{background:#f1c40f;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0 16px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);
    border-radius:11px;font:inherit;background:#fff;color:var(--ink)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  select.filter{padding:11px 14px;border:1px solid var(--line);border-radius:11px;
    font:inherit;background:#fff;color:var(--ink);cursor:pointer}
  .btn{border:none;border-radius:11px;padding:11px 18px;font:inherit;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy-d)}
  .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--band)}

  .entries{display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);
    border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);
    display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:start;
    animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card .date{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:15px;line-height:1.3}
  .card .date small{display:block;font-family:'Spline Sans';font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
  .card .body h3{font-size:15px;font-weight:600;margin-bottom:4px}
  .card .body p{font-size:13.5px;color:var(--muted);line-height:1.5;white-space:pre-wrap}
  .card .action{font-size:12.5px;margin-top:8px;color:var(--ink);background:var(--band);
    border-radius:8px;padding:6px 10px;display:inline-block}
  .meta{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .tag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .row-actions{display:flex;gap:6px}
  .icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;
    cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:.15s}
  .icon-btn:hover{background:var(--band);color:var(--navy)}
  .status{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .status::before{content:"";width:7px;height:7px;border-radius:50%}
  .s-afaire::before{background:var(--grey)} .s-afaire{color:var(--grey)}
  .s-encours::before{background:var(--amber)} .s-encours{color:var(--amber)}
  .s-fait::before{background:var(--green)} .s-fait{color:var(--green)}
  .s-annule::before{background:var(--red)} .s-annule{color:var(--red)}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty svg{opacity:.35;margin-bottom:14px}

  .overlay{position:fixed;inset:0;background:rgba(19,40,52,.45);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(19,40,52,.3);
    animation:rise .25s ease both}
  .modal header{background:var(--navy);color:#fff;padding:18px 24px;border-radius:18px 18px 0 0;
    font-family:'Fraunces',serif;font-size:19px;font-weight:600}
  .modal .form{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:.04em}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;font:inherit;color:var(--ink);background:#fff}
  .field textarea{resize:vertical;min-height:80px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .modal footer{padding:0 24px 22px;display:flex;justify-content:flex-end;gap:10px}

  footer.foot{text-align:center;margin-top:40px;color:var(--muted);font-size:12px}
  @media(max-width:640px){
    .card{grid-template-columns:1fr;gap:10px}
    .meta{flex-direction:row;align-items:center;justify-content:space-between}
    .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📔 Journal de Bord</h1>
    <p>OMAR Cheptel — événements, notes & rappels. Journal commun synchronisé.</p>
    <div class="stats">
      <div class="stat"><b id="st-total">0</b><span>Entrées</span></div>
      <div class="stat"><b id="st-todo">0</b><span>À faire</span></div>
      <div class="stat"><b id="st-month">0</b><span>Ce mois-ci</span></div>
    </div>
    <div class="sync load" id="syncBadge"><span class="dot"></span><span id="syncText">Connexion…</span></div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="Rechercher un événement, une note…">
    </div>
    <select class="filter" id="filterCat"><option value="">Toutes catégories</option></select>
    <select class="filter" id="filterStatus">
      <option value="">Tous statuts</option>
      <option>À faire</option><option>En cours</option><option>Fait</option><option>Annulé</option>
    </select>
    <button class="btn btn-ghost" id="exportBtn">⤓ Exporter</button>
    <button class="btn btn-primary" id="addBtn">＋ Nouvelle entrée</button>
  </div>

  <div class="entries" id="list"></div>
  <footer class="foot">Journal commun — les entrées sont partagées en temps réel avec tous ceux qui ont le lien.</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <header id="modalTitle">Nouvelle entrée</header>
    <div class="form">
      <input type="hidden" id="editId">
      <div class="grid2">
        <div class="field"><label>Date</label><input type="date" id="f-date"></div>
        <div class="field"><label>Catégorie</label>
          <select id="f-cat">
            <option>Sanitaire</option><option>Reproduction</option><option>Alimentation</option>
            <option>Météo</option><option>Logistique</option><option>Décision</option>
            <option>Rappel</option><option>Divers</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Titre de l'événement</label><input id="f-title" placeholder="Ex. : Vaccination du lot nord"></div>
      <div class="field"><label>Note / détail</label><textarea id="f-note" placeholder="Description, observations…"></textarea></div>
      <div class="grid2">
        <div class="field"><label>Action à suivre</label><input id="f-action" placeholder="Optionnel"></div>
        <div class="field"><label>Statut</label>
          <select id="f-status"><option>À faire</option><option>En cours</option><option>Fait</option><option>Annulé</option></select>
        </div>
      </div>
    </div>
    <footer>
      <button class="btn btn-ghost" id="cancelBtn">Annuler</button>
      <button class="btn btn-primary" id="saveBtn">Enregistrer</button>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---- Configuration Supabase ----
const SUPABASE_URL='https://dfwlenkiejgbetsazpsq.supabase.co';
const SUPABASE_KEY='sb_publishable_HdbL33Z4cSyKOaet2HMoqA_6a4NvQ2o';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const CATS=['Sanitaire','Reproduction','Alimentation','Météo','Logistique','Décision','Rappel','Divers'];
const CAT_COLOR={Sanitaire:'#922b21',Reproduction:'#7d3c98',Alimentation:'#1e8449',
  'Météo':'#2471a3',Logistique:'#b9770e','Décision':'#1A5276',Rappel:'#117a65',Divers:'#5a6b7a'};
const STATUS_CLASS={'À faire':'s-afaire','En cours':'s-encours','Fait':'s-fait','Annulé':'s-annule'};

let data=[];

function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtDate(d){if(!d)return'';const[y,m,j]=d.split('-');
  const mois=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return j+' '+mois[+m-1]+' '+y}
function weekday(d){if(!d)return'';return new Date(d).toLocaleDateString('fr-FR',{weekday:'long'})}

function setSync(state,text){
  const b=document.getElementById('syncBadge');
  b.className='sync '+state;
  document.getElementById('syncText').textContent=text;
}

const fc=document.getElementById('filterCat');
CATS.forEach(c=>{const o=document.createElement('option');o.textContent=c;fc.appendChild(o)});

async function fetchAll(){
  setSync('load','Synchronisation…');
  const {data:rows,error}=await sb.from('entries').select('*').order('date',{ascending:false}).order('created_at',{ascending:false});
  if(error){setSync('err','Hors ligne — '+error.message);console.error(error);return}
  data=rows||[];
  setSync('ok','Synchronisé');
  render();
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const fcat=document.getElementById('filterCat').value;
  const fst=document.getElementById('filterStatus').value;
  let rows=data.filter(e=>{
    const hay=((e.title||'')+' '+(e.note||'')+' '+(e.action||'')+' '+(e.cat||'')).toLowerCase();
    return(!q||hay.includes(q))&&(!fcat||e.cat===fcat)&&(!fst||e.status===fst);
  });

  const ym=new Date().toISOString().slice(0,7);
  document.getElementById('st-total').textContent=data.length;
  document.getElementById('st-todo').textContent=data.filter(e=>e.status==='À faire').length;
  document.getElementById('st-month').textContent=data.filter(e=>(e.date||'').startsWith(ym)).length;

  const list=document.getElementById('list');
  if(!rows.length){
    list.innerHTML=`<div class="empty">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1A5276" stroke-width="1.4"><path d="M4 4h13l3 3v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      <p>${data.length?'Aucune entrée ne correspond à la recherche.':'Aucune entrée pour le moment. Cliquez sur « Nouvelle entrée » pour commencer.'}</p></div>`;
    return;
  }
  list.innerHTML=rows.map(e=>`
    <div class="card" style="border-left-color:${CAT_COLOR[e.cat]||'#1A5276'}">
      <div class="date">${fmtDate(e.date)||'—'}<small>${weekday(e.date)}</small></div>
      <div class="body">
        <h3>${esc(e.title)||'(sans titre)'}</h3>
        ${e.note?`<p>${esc(e.note)}</p>`:''}
        ${e.action?`<div class="action">↳ ${esc(e.action)}</div>`:''}
      </div>
      <div class="meta">
        <span class="tag" style="background:${(CAT_COLOR[e.cat]||'#1A5276')}1a;color:${CAT_COLOR[e.cat]||'#1A5276'}">${esc(e.cat)}</span>
        <span class="status ${STATUS_CLASS[e.status]||''}">${esc(e.status)}</span>
        <div class="row-actions">
          <button class="icon-btn" title="Modifier" onclick="edit('${e.id}')">✎</button>
          <button class="icon-btn" title="Supprimer" onclick="del('${e.id}')">🗑</button>
        </div>
      </div>
    </div>`).join('');
}

const ov=document.getElementById('overlay');
function openModal(entry){
  document.getElementById('modalTitle').textContent=entry?'Modifier l\'entrée':'Nouvelle entrée';
  document.getElementById('editId').value=entry?entry.id:'';
  document.getElementById('f-date').value=entry?entry.date:new Date().toISOString().slice(0,10);
  document.getElementById('f-cat').value=entry?entry.cat:'Sanitaire';
  document.getElementById('f-title').value=entry?entry.title:'';
  document.getElementById('f-note').value=entry?entry.note:'';
  document.getElementById('f-action').value=entry?entry.action:'';
  document.getElementById('f-status').value=entry?entry.status:'À faire';
  ov.classList.add('open');
}
function closeModal(){ov.classList.remove('open')}
window.edit=id=>openModal(data.find(e=>e.id===id));
window.del=async id=>{
  if(!confirm('Supprimer cette entrée ?'))return;
  setSync('load','Suppression…');
  const {error}=await sb.from('entries').delete().eq('id',id);
  if(error){setSync('err','Erreur suppression');alert(error.message);return}
  await fetchAll();
};

document.getElementById('addBtn').onclick=()=>openModal(null);
document.getElementById('cancelBtn').onclick=closeModal;
ov.onclick=e=>{if(e.target===ov)closeModal()};
document.getElementById('saveBtn').onclick=async()=>{
  const id=document.getElementById('editId').value;
  const obj={
    date:document.getElementById('f-date').value,
    cat:document.getElementById('f-cat').value,
    title:document.getElementById('f-title').value.trim(),
    note:document.getElementById('f-note').value.trim(),
    action:document.getElementById('f-action').value.trim(),
    status:document.getElementById('f-status').value
  };
  if(!obj.title&&!obj.note){alert('Saisissez au moins un titre ou une note.');return}
  setSync('load','Enregistrement…');
  let error;
  if(id){({error}=await sb.from('entries').update(obj).eq('id',id))}
  else{({error}=await sb.from('entries').insert(obj))}
  if(error){setSync('err','Erreur enregistrement');alert(error.message);return}
  closeModal();
  await fetchAll();
};

['search','filterCat','filterStatus'].forEach(i=>document.getElementById(i).addEventListener('input',render));

document.getElementById('exportBtn').onclick=()=>{
  if(!data.length){alert('Aucune entrée à exporter.');return}
  const head=['Date','Catégorie','Titre','Note','Action','Statut'];
  const rows=[...data].sort((a,b)=>(a.date||'').localeCompare(b.date||''))
    .map(e=>[e.date,e.cat,e.title,e.note,e.action,e.status]
    .map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';'));
  const csv='\uFEFF'+[head.join(';'),...rows].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='journal_omar_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
};

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// Synchronisation temps réel : recharge dès qu'un autre appareil modifie la base
sb.channel('entries-rt')
  .on('postgres_changes',{event:'*',schema:'public',table:'entries'},()=>fetchAll())
  .subscribe();

fetchAll();
</script>
</body>
</html>
