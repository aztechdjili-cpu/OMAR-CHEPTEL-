<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMAR Pro — Gestion Cheptel</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F7F6F2;--white:#FFFFFF;--border:#E2DDD4;--border2:#C8C2B8;
  --text:#1A1A14;--text2:#6B6558;--text3:#A09890;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-text:#27500A;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-text:#791F1F;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --amber:#854F0B;--amber-bg:#FAEEDA;--amber-text:#633806;
  --r:8px;--rl:12px;
}
body{font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
body.rtl{direction:rtl}

aside{width:220px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.logo-sheep{font-size:28px;line-height:1}
.logo-name{font-size:16px;font-weight:600;color:var(--green);margin-top:4px}
.logo-sub{font-size:11px;color:var(--text3);margin-top:1px}
.mode-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;margin-top:6px}
.mode-admin{background:var(--green-bg);color:var(--green-text)}
.mode-visitor{background:var(--amber-bg);color:var(--amber-text)}
nav{flex:1;padding:10px 0;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s;border-left:3px solid transparent;user-select:none}
body.rtl .ni{border-left:none;border-right:3px solid transparent}
.ni:hover{background:#F0EDE7;color:var(--text)}
.ni.active{background:var(--green-bg);color:var(--green-text);border-left-color:var(--green);font-weight:500}
body.rtl .ni.active{border-left-color:transparent;border-right-color:var(--green)}
.ni i{font-size:17px;width:20px;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.lang-btn,.mode-btn{width:100%;padding:7px;font-size:12px;cursor:pointer;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;font-family:inherit}
.lang-btn:hover,.mode-btn:hover{border-color:var(--border2);color:var(--text)}
.mode-btn.admin-mode{background:var(--green-bg);color:var(--green-text);border-color:#A8D080}

main{flex:1;display:flex;flex-direction:column;min-width:0;max-height:100vh;overflow-y:auto}
.topbar{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--white);position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between}
.page-title{font-size:16px;font-weight:600;color:var(--text)}
.page-sub{font-size:11px;color:var(--text3);margin-top:2px}
.content{padding:20px 24px;flex:1}

.btn-p{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:12px;cursor:pointer;font-weight:500;transition:all .15s;font-family:inherit}
.btn-p:hover{background:var(--green-text)}
.btn-s{padding:6px 14px;font-size:12px;cursor:pointer;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .15s;font-family:inherit}
.btn-s:hover{border-color:var(--border2);background:var(--bg)}
.btn-d{padding:5px 9px;font-size:11px;cursor:pointer;border-radius:var(--r);border:1px solid #F7C1C1;background:transparent;color:var(--red);transition:all .15s}
.btn-d:hover{background:var(--red-bg)}
.btn-locked{padding:5px 9px;font-size:11px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:not-allowed;opacity:.5}

.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.kcard{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:16px 14px;border-top:3px solid var(--green)}
.kcard.sky{border-top-color:var(--blue)}
.kcard.red{border-top-color:var(--red)}
.kcard.amb{border-top-color:var(--amber)}
.klabel{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:500}
.kval{font-size:28px;font-weight:600;color:var(--text);line-height:1.1;margin:6px 0 3px}
.ksub{font-size:11px;color:var(--text3)}

.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:16px}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#FAFAF8}
.card-tt{font-size:13px;font-weight:500;color:var(--text)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 14px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);font-weight:500;background:#F7F6F2;border-bottom:1px solid var(--border)}
body.rtl th{text-align:right}
td{padding:9px 14px;border-bottom:1px solid #F0EDE7;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF8}
tfoot td{background:#F7F6F2;font-weight:500;border-top:1px solid var(--border)}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500}
.bg{background:var(--green-bg);color:var(--green-text)}
.br{background:var(--red-bg);color:var(--red-text)}
.ba{background:var(--amber-bg);color:var(--amber-text)}
.bi{background:var(--blue-bg);color:var(--blue-text)}
.bx{background:#F0EDE7;color:var(--text2)}
.aid-oui{background:var(--green-bg);color:var(--green-text);display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500}
.aid-non{background:#F0EDE7;color:var(--text3);display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
.fgroup{display:flex;flex-direction:column;gap:5px}
.fgroup.full{grid-column:1/-1}
label{font-size:10px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
input,select{border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:13px;color:var(--text);background:var(--white);outline:none;font-family:inherit;width:100%;transition:border-color .15s}
input:focus,select:focus{border-color:var(--blue)}

.moverlay{display:none;position:fixed;inset:0;background:rgba(26,26,20,.5);z-index:200;align-items:center;justify-content:center}
.moverlay.open{display:flex}
.modal{background:var(--white);border-radius:16px;width:min(500px,95vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mhd{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#FAFAF8;border-radius:16px 16px 0 0}
.mtt{font-size:14px;font-weight:500}
.mclose{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text3);line-height:1}
.mft{padding:14px 16px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border)}

/* LOGIN MODAL */
.login-modal{background:var(--white);border-radius:16px;width:min(360px,95vw);box-shadow:0 20px 60px rgba(0,0,0,.2);padding:32px 28px;text-align:center}
.login-icon{font-size:40px;margin-bottom:12px}
.login-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:24px}
.login-input{width:100%;border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;font-size:14px;text-align:center;letter-spacing:3px;font-family:inherit;outline:none;margin-bottom:12px}
.login-input:focus{border-color:var(--blue)}
.login-error{font-size:12px;color:var(--red);margin-bottom:12px;display:none}
.login-btns{display:flex;gap:10px;justify-content:center}

.row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.fin3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.fcell{text-align:center;padding:14px;background:var(--white);border-radius:var(--r);border:1px solid var(--border)}
.fclbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);font-weight:500;margin-bottom:6px}
.fcval{font-size:18px;font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}
.empty{text-align:center;padding:44px 20px;color:var(--text3);font-size:13px}
.empty i{font-size:40px;display:block;margin-bottom:10px;opacity:.35}
.bar-item{margin-bottom:14px}
.bar-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:5px}
.bar-track{background:#F0EDE7;border-radius:4px;height:9px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.visitor-notice{padding:10px 14px;background:var(--amber-bg);border:1px solid #E8C070;border-radius:var(--r);font-size:12px;color:var(--amber-text);margin-bottom:14px;display:flex;align-items:center;gap:8px}

.hamburger{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text)}
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:98}
@media(max-width:768px){
  aside{position:fixed;left:0;top:0;height:100vh;z-index:99;transform:translateX(-100%);transition:transform .25s}
  body.rtl aside{left:auto;right:0;transform:translateX(100%)}
  aside.open{transform:none}
  .hamburger{display:block}
  .mob-overlay.open{display:block}
  .content{padding:14px 16px}
  .topbar{padding:12px 16px}
  .kgrid{grid-template-columns:1fr 1fr}
  .fin3{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
}
</style>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="mob-overlay" id="mobOverlay" onclick="closeSidebar()"></div>

<aside id="sidebar">
  <div class="logo">
    <div class="logo-sheep">🐑</div>
    <div class="logo-name">OMAR Pro</div>
    <div class="logo-sub" id="logoSub">Gestion Cheptel</div>
    <div class="mode-badge" id="modeBadge">👁 Visiteur</div>
  </div>
  <nav>
    <div class="ni active" onclick="go('db')" data-p="db"><i class="ti ti-chart-bar"></i><span data-fr="Tableau de bord" data-ar="لوحة القيادة">Tableau de bord</span></div>
    <div class="ni" onclick="go('ch')" data-p="ch"><i class="ti ti-list"></i><span data-fr="Registre cheptel" data-ar="سجل القطيع">Registre cheptel</span></div>
    <div class="ni" onclick="go('bb')" data-p="bb"><i class="ti ti-heart"></i><span data-fr="Naissances" data-ar="المواليد">Naissances</span></div>
    <div class="ni" onclick="go('dep')" data-p="dep"><i class="ti ti-receipt"></i><span data-fr="Dépenses" data-ar="المصاريف">Dépenses</span></div>
    <div class="ni" onclick="go('bil')" data-p="bil"><i class="ti ti-scale"></i><span data-fr="Bilan financier" data-ar="الميزانية">Bilan financier</span></div>
    <div class="ni" onclick="go('av')" data-p="av"><i class="ti ti-arrows-exchange"></i><span data-fr="Achats & Ventes" data-ar="مشتريات ومبيعات">Achats & Ventes</span></div>
  </nav>
  <div class="sidebar-footer">
    <button class="mode-btn" id="modeBtn" onclick="toggleMode()"><i class="ti ti-lock"></i> <span id="modeBtnTxt">Mode Admin</span></button>
    <button class="lang-btn" onclick="toggleLang()"><i class="ti ti-world"></i> <span id="langBtnTxt">عربي</span></button>
  </div>
</aside>

<main>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="hamburger" onclick="toggleSidebar()"><i class="ti ti-menu-2"></i></button>
      <div>
        <div class="page-title" id="ptitle">Tableau de bord</div>
        <div class="page-sub" id="psub">Vue d'ensemble — Juin 2026</div>
      </div>
    </div>
  </div>
  <div class="content" id="content"></div>
</main>

<!-- MODAL FORMULAIRES -->
<div class="moverlay" id="moverlay">
  <div class="modal">
    <div class="mhd"><span class="mtt" id="mtitle"></span><button class="mclose" onclick="cm()">✕</button></div>
    <div id="mbody"></div>
    <div class="mft" id="mfooter"></div>
  </div>
</div>

<!-- MODAL LOGIN ADMIN -->
<div class="moverlay" id="loginOverlay">
  <div class="login-modal">
    <div class="login-icon">🔐</div>
    <div class="login-title" id="loginTitle">Accès Administrateur</div>
    <div class="login-sub" id="loginSub">Entrez le mot de passe pour accéder au mode admin</div>
    <input type="password" class="login-input" id="loginInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPwd()">
    <div class="login-error" id="loginError">Mot de passe incorrect</div>
    <div class="login-btns">
      <button class="btn-s" onclick="closeLogin()">Annuler</button>
      <button class="btn-p" onclick="checkPwd()"><i class="ti ti-lock-open"></i> Entrer</button>
    </div>
  </div>
</div>

<script>
let lang='fr';
let isAdmin=false;
const ADMIN_PWD='16/11/1968';

const META={
  db:{fr:'Tableau de bord',ar:'لوحة القيادة',sf:'Vue d\'ensemble — Juin 2026',sa:'نظرة عامة — يونيو 2026'},
  ch:{fr:'Registre cheptel',ar:'سجل القطيع',sf:'Mouvements et effectifs',sa:'الحركات والأعداد'},
  bb:{fr:'Gestion naissances',ar:'إدارة المواليد',sf:'Registre des agneaux',sa:'سجل الحملان'},
  dep:{fr:'Dépenses',ar:'المصاريف',sf:'Suivi par catégorie',sa:'متابعة حسب الفئة'},
  bil:{fr:'Bilan financier',ar:'الميزانية المالية',sf:'Résultats mensuels',sa:'النتائج الشهرية'},
  av:{fr:'Achats & Ventes',ar:'مشتريات ومبيعات',sf:'Registre des transactions',sa:'سجل المعاملات'},
};
function T(k){return({
  add:{fr:'+ Ajouter',ar:'+ إضافة'},date:{fr:'Date',ar:'التاريخ'},
  cat:{fr:'Catégorie',ar:'الفئة'},desc:{fr:'Description',ar:'الوصف'},
  obs:{fr:'Observation',ar:'ملاحظة'},type:{fr:'Type',ar:'النوع'},
  sexe:{fr:'Sexe',ar:'الجنس'},qte:{fr:'Quantité',ar:'الكمية'},
  pu:{fr:'Prix unitaire',ar:'سعر الوحدة'},total:{fr:'Total',ar:'المجموع'},
  male:{fr:'Mâle',ar:'ذكر'},fem:{fr:'Femelle',ar:'أنثى'},
  mois:{fr:'Mois',ar:'الشهر'},res:{fr:'Résultat net',ar:'النتيجة'},
  save:{fr:'Enregistrer',ar:'حفظ'},cancel:{fr:'Annuler',ar:'إلغاء'},
}[k]||{fr:k,ar:k})[lang];}
function fn(n){return Number(n||0).toLocaleString('fr-DZ');}

// ── MODE ADMIN ──
function toggleMode(){
  if(isAdmin){
    isAdmin=false;
    updateModeUI();
    go(CP);
  } else {
    document.getElementById('loginOverlay').classList.add('open');
    document.getElementById('loginInput').value='';
    document.getElementById('loginError').style.display='none';
    setTimeout(()=>document.getElementById('loginInput').focus(),100);
  }
}
function checkPwd(){
  const val=document.getElementById('loginInput').value;
  if(val===ADMIN_PWD){
    isAdmin=true;
    document.getElementById('loginOverlay').classList.remove('open');
    updateModeUI();
    go(CP);
  } else {
    document.getElementById('loginError').style.display='block';
    document.getElementById('loginInput').value='';
    document.getElementById('loginInput').focus();
  }
}
function closeLogin(){
  document.getElementById('loginOverlay').classList.remove('open');
}
function updateModeUI(){
  const badge=document.getElementById('modeBadge');
  const btn=document.getElementById('modeBtn');
  const btnTxt=document.getElementById('modeBtnTxt');
  if(isAdmin){
    badge.textContent='⚙️ Administrateur';
    badge.className='mode-badge mode-admin';
    btn.className='mode-btn admin-mode';
    btnTxt.textContent=lang==='fr'?'Déconnexion Admin':'خروج من الإدارة';
    btn.querySelector('i').className='ti ti-lock-open';
  } else {
    badge.textContent=lang==='fr'?'👁 Visiteur':'👁 زائر';
    badge.className='mode-badge mode-visitor';
    btn.className='mode-btn';
    btnTxt.textContent=lang==='fr'?'Mode Admin':'وضع الإدارة';
    btn.querySelector('i').className='ti ti-lock';
  }
}
function adminBtn(action,id){
  if(!isAdmin) return `<button class="btn-locked" title="${lang==='fr'?'Réservé admin':'للمسؤول فقط'}"><i class="ti ti-lock"></i></button>`;
  return `<button class="btn-d" onclick="${action}(${id})"><i class="ti ti-trash"></i></button>`;
}
function adminAddBtn(action,label){
  if(!isAdmin) return `<button class="btn-s" style="opacity:.5;cursor:not-allowed" disabled><i class="ti ti-lock"></i> ${lang==='fr'?'Admin requis':'للمسؤول فقط'}</button>`;
  return `<button class="btn-p" onclick="${action}()"><i class="ti ti-plus"></i> ${label}</button>`;
}
function visitorBanner(){
  if(isAdmin) return '';
  return `<div class="visitor-notice"><i class="ti ti-eye"></i> ${lang==='fr'?'Mode lecture seule — connectez-vous en admin pour modifier les données':'وضع القراءة فقط — سجل دخول كمسؤول لتعديل البيانات'}</div>`;
}

const CAPITAL_DEPART_DEFAULT=340000;
function getCapital(){return parseInt(localStorage.getItem("op_capital")||CAPITAL_DEPART_DEFAULT);}
function setCapital(v){localStorage.setItem("op_capital",v);fbdb.ref("omar/capital").set(v);}
const MOIS_LIST=['Juin 2026','Juillet 2026','Août 2026','Septembre 2026','Octobre 2026','Novembre 2026','Décembre 2026'];
const CATS=['Alimentation','Vétérinaire','Transport','Infrastructure','Personnel','Divers'];
const CAT_CLS={Alimentation:'bg',Vétérinaire:'bi',Transport:'ba',Infrastructure:'bx',Personnel:'bi',Divers:'bx'};
const CAT_C={Alimentation:'#3B6D11',Vétérinaire:'#185FA5',Transport:'#854F0B',Infrastructure:'#BA7517',Personnel:'#533AB7',Divers:'#888780'};

const DC={
  cheptel:[],
  naissances:[],depenses:[],ventes:[],
  // Effectif par tranche : {mPlus:M+6mois, fPlus:F+6mois, mMoins:M-6mois, fMoins:F-6mois}
  effectif:{mPlus:0,fPlus:0,mMoins:0,fMoins:0},
  mouvements:[{id:1,date:'01/06/2026',tranche:'plus6',sexe:'M',qte:4,type:'init',obs:'Mâles adultes départ'}],
};
// ── FIREBASE CONFIG ──
const firebaseConfig = {
  apiKey: "AIzaSyBfCEB-FTKxDNxXeOQXH4IzTfwobKiNc9Q",
  authDomain: "omar-cheptel.firebaseapp.com",
  databaseURL: "https://omar-cheptel-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "omar-cheptel",
  storageBucket: "omar-cheptel.firebasestorage.app",
  messagingSenderId: "559496216411",
  appId: "1:559496216411:web:49fba8d7a211733d25e47e",
  measurementId: "G-HSPZBSHD10"
};
firebase.initializeApp(firebaseConfig);
const fbdb = firebase.database();

// ── LOCAL DB (updated by Firebase listeners) ──
let DB={
  cheptel:[],naissances:[],depenses:[],ventes:[],
  effectif:{mPlus:0,fPlus:0,mMoins:0,fMoins:0},
  mouvements:[],
};
let DB_READY=false;

// ── SAVE TO FIREBASE ──
function sv(k,d){
  fbdb.ref('omar/'+k).set(d);
}
function svCapital(v){
  fbdb.ref('omar/capital').set(v);
}

// ── FIREBASE LISTENERS (sync temps réel) ──
const KEYS=['cheptel','naissances','depenses','ventes','effectif','mouvements'];
let loadedKeys=new Set();
KEYS.forEach(k=>{
  fbdb.ref('omar/'+k).on('value', snap=>{
    const val=snap.val();
    if(val!==null) DB[k]=Array.isArray(val)?val:(typeof val==='object'?val:{});
    else if(k==='effectif') DB[k]={mPlus:0,fPlus:0,mMoins:0,fMoins:0};
    else DB[k]=[];
    loadedKeys.add(k);
    if(loadedKeys.size===KEYS.length&&!DB_READY){
      DB_READY=true;
      go('db');
    } else if(DB_READY){
      go(CP);
    }
  });
});
fbdb.ref('omar/capital').on('value', snap=>{
  const val=snap.val();
  if(val!==null) localStorage.setItem('op_capital', val);
});

function cm(){document.getElementById('moverlay').classList.remove('open');}
function om(title,body,footer){
  document.getElementById('mtitle').textContent=title;
  document.getElementById('mbody').innerHTML=body;
  document.getElementById('mfooter').innerHTML=footer;

function retireMvt(tranche){
  if(!isAdmin)return;
  const tLabel=tranche==='plus6'?(lang==='fr'?'+6 mois':'+6 أشهر'):(lang==='fr'?'-6 mois':'-6 أشهر');
  om(lang==='fr'?`Retirer — ${tLabel}`:`إزالة — ${tLabel}`,
    `<div class="fgrid">
      <div class="fgroup"><label>${T('date')}</label><input type="date" id="mv_d" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="fgroup"><label>${lang==='fr'?'Sexe':'الجنس'}</label><select id="mv_s"><option value="M">${lang==='fr'?'Mâle':'ذكر'}</option><option value="F">${lang==='fr'?'Femelle':'أنثى'}</option></select></div>
      <div class="fgroup"><label>${lang==='fr'?'Nombre de têtes':'عدد الرؤوس'}</label><input type="number" id="mv_q" value="1" min="1"></div>
      <div class="fgroup full"><label>${T('obs')}</label><input type="text" id="mv_o" placeholder="${lang==='fr'?'Vente, décès...':'بيع، نفوق...'}"></div>
    </div>`,
    `<button class="btn-s" onclick="cm()"><i class="ti ti-x"></i> ${T('cancel')}</button><button class="btn-p" style="background:var(--red)" onclick="svMvt('${tranche}',-1)"><i class="ti ti-check"></i> ${T('save')}</button>`);
}
function svMvt(tranche,sign){
  const sexe=document.getElementById('mv_s').value;
  const qte=(parseInt(document.getElementById('mv_q').value)||1)*sign;
  const obs=document.getElementById('mv_o').value;
  const date=document.getElementById('mv_d').value;
  const e=DB.effectif;
  if(tranche==='plus6'){if(sexe==='M')e.mPlus+=qte;else e.fPlus+=qte;}
  else{if(sexe==='M')e.mMoins+=qte;else e.fMoins+=qte;}
  e.mPlus=Math.max(0,e.mPlus);e.fPlus=Math.max(0,e.fPlus);
  e.mMoins=Math.max(0,e.mMoins);e.fMoins=Math.max(0,e.fMoins);
  const mvts=DB.mouvements;
  const lastId=mvts.length?mvts[mvts.length-1].id:0;
  mvts.push({id:lastId+1,date,tranche,sexe,qte,obs});
  sv('eff',DB.effectif);sv('mvt',DB.mouvements);cm();go('ch');
}
function delMvt(id){
  if(!isAdmin)return;
  if(confirm(lang==='fr'?'Supprimer ce mouvement ? L\'effectif sera recalculé.':'حذف هذه الحركة؟')){
    const mvt=DB.mouvements.find(x=>x.id===id);
    if(mvt){
      const e=DB.effectif;
      if(mvt.tranche==='plus6'){if(mvt.sexe==='M')e.mPlus-=mvt.qte;else e.fPlus-=mvt.qte;}
      else{if(mvt.sexe==='M')e.mMoins-=mvt.qte;else e.fMoins-=mvt.qte;}
      e.mPlus=Math.max(0,e.mPlus);e.fPlus=Math.max(0,e.fPlus);
      e.mMoins=Math.max(0,e.mMoins);e.fMoins=Math.max(0,e.fMoins);
      DB.mouvements=DB.mouvements.filter(x=>x.id!==id);
      sv('eff',DB.effectif);sv('mvt',DB.mouvements);go('ch');
    }
  }
}
function addCh(){if(!isAdmin)return;addMvt('plus6');}
function svCh(){}
function delCh(id){delMvt(id);}

function toggleLang(){

  document.body.classList.toggle('rtl',lang==='ar');
  document.getElementById('langBtnTxt').textContent=lang==='fr'?'عربي':'Français';
  document.getElementById('logoSub').textContent=lang==='ar'?'إدارة القطيع':'Gestion Cheptel';
  document.querySelectorAll('[data-fr]').forEach(el=>el.textContent=lang==='fr'?el.dataset.fr:el.dataset.ar);
  updateModeUI();
  go(CP);
}

function editCapital(){

  om(lang==='fr'?'Modifier le capital de départ':'تعديل رأس المال',
    `<div class="fgrid"><div class="fgroup full">
      <label>${lang==='fr'?'Capital de départ (DZD)':'رأس المال الابتدائي (دج)'}</label>
      <input type="number" id="cap_val" value="${cur}" min="0" style="font-size:16px;font-weight:600;text-align:right">
      <div style="font-size:11px;color:var(--text3);margin-top:4px">${lang==='fr'?'Valeur actuelle :':'القيمة الحالية :'} <strong>${fn(cur)} DZD</strong></div>

    `<button class="btn-s" onclick="cm()"><i class="ti ti-x"></i> ${T('cancel')}</button>
     <button class="btn-p" style="background:var(--amber)" onclick="resetCapital()"><i class="ti ti-refresh"></i> ${lang==='fr'?'Reset 340 000':'إعادة تعيين'}</button>
     <button class="btn-p" onclick="saveCapital()"><i class="ti ti-check"></i> ${T('save')}</button>`);

function saveCapital(){
  const val=parseInt(document.getElementById('cap_val').value)||0;

}
function resetCapital(){
  if(confirm(lang==='fr'?'Réinitialiser le capital à 340 000 DZD ?':'إعادة تعيين رأس المال إلى 340,000 دج؟')){
    setCapital(340000);cm();go('bil');
